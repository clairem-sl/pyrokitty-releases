; Godot project setting overrides for VR (Quest 3 via PC Link).
; Copied to override.cfg by godot-bridge.ts when launched with --vr.
; override.cfg is deleted on non-VR launches and is .gitignored.

[xr]

openxr/enabled=true
; Required for ATW depth reprojection — do not remove. See VR_SUCKS.md #1.
openxr/submit_depth_buffer=true
shaders/enabled=true
